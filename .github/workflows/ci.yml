name: Build and deploy Jekyll to Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Stage campaign includes with space-free filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _includes/campaign
          cp -- "campaign/Creepy mirror scene.md" _includes/campaign/creepy-mirror.md
          cp -- "campaign/Dining hall description.md" _includes/campaign/dining-hall.md
          cp -- "campaign/Player Hooks and Backgrounds.md" _includes/campaign/player-hooks.md
          cp -- "campaign/Strahd Answers.md" _includes/campaign/strahd-answers.md
      - name: Generate house-rule web editions
        run: python3 _scripts/publish_house_rules.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
