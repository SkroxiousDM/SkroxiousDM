name: Build and deploy Jekyll to Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Exclude campaign sources from the build workspace
        run: python3 _scripts/unpublish_campaign.py prepare
      - name: Test Markdown publishing
        run: python3 -m unittest discover -s _scripts -p 'test_*.py'
      - name: Generate documentation web editions
        run: python3 _scripts/publish_docs.py
      - name: Redirect reference landing to overview
        shell: bash
        run: |
          set -euo pipefail
          test -f reference/overview/index.md
          rm -- reference/index.md
          cat > reference/index.html <<'EOF'
          ---
          layout: null
          permalink: /reference/
          ---
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Reference overview</title>
            <meta http-equiv="refresh" content="0; url={{ '/reference/overview/' | relative_url }}">
            <link rel="canonical" href="{{ '/reference/overview/' | absolute_url }}">
          </head>
          <body>
            <p>Continue to the <a href="{{ '/reference/overview/' | relative_url }}">reference overview</a>.</p>
          </body>
          </html>
          EOF
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Remove campaign output and navigation before deployment
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" -- _site
          chmod -R u+rwX -- _site
          python3 _scripts/unpublish_campaign.py prune
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
