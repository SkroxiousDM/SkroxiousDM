title: SkroxiousDM
description: A synthesis of Roleplaying systems, and campaign reference material.
url: "https://skroxiousdm.com"
baseurl: ""
lang: en-CA
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - docs
  - Images
  - "ChatGPT templates"
  - .obsidian
  - mkdocs.yml
  - ci.yml
  - SITE_SETUP.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
